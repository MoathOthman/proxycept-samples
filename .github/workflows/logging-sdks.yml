name: Logging SDK checks
on:
  pull_request:
    paths: ['sdks/**', 'Package.swift', '.github/workflows/logging-sdks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logging-sdks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: sdks/react-native/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test && npm run typecheck && npm run build && npm run check:native-source
      - run: npm pack --dry-run
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the qualified Flutter toolchain
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: sdks/flutter
  kotlin:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon -p sdks/kotlin test jar
      - run: gradle --no-daemon -p sdks/react-native/android/jvm test
      - run: gradle --no-daemon -p sdks/kotlin-multiplatform jvmTest assembleDebug lintDebug
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift test --package-path sdks/react-native/ios
