name: proxycept_logging
description: Explicit, bounded and redacted mobile application logging for Proxycept.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.proxycept.loggingflutter
        pluginClass: ProxyceptLoggingPlugin
      ios:
        pluginClass: ProxyceptLoggingPlugin
